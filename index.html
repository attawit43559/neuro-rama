<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="คู่มือแพทย์ประจำบ้านและแพทย์ประจำบ้านต่อยอด สาขาประสาทวิทยา หน่วยประสาทวิทยา ภาควิชาอายุรศาสตร์ คณะแพทยศาสตร์โรงพยาบาลรามาธิบดี มหาวิทยาลัยมหิดล">
<link rel="icon" href="img/logo.jpg">
<style>body{margin:0}</style>
</head>
<body>
<title>Neurology Ramathibodi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Official program website. Brand from the NEURO RAMA mark: navy ink, orange + teal dots, warm sand. Editorial layout: full-bleed sections, hairlines, photos — no card grids. */
:root{
  --paper:#FFFFFF; --paper2:#F4F7FC; --ink:#0B2A63; --text:#1D2433; --muted:#5A6478; --line:#E3E8F1;
  --navy:#0B2A63; --gold:#FFC629; --accent:#1B55C0; --teal:#1B55C0; --sand:#FFD766; --on-navy:#F3F6FC; --on-navy-muted:#B4C1DD;
  --alert:#C4321E; --alert-soft:#FBEAE6; --exam:#7A3FB0; --exam-soft:#F2EAFA; --due:#9A5B00; --due-soft:#FBF0DC; --meet:#0F7C76; --meet-soft:#E1F3F1; --hl:#FFE48A;
  --f-head:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Anuphan",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1); --max:1200px;
}
:root[data-theme="dark"]{
  --paper:#0D1322; --paper2:#131B2E; --ink:#EEF2FB; --text:#D9DFEC; --muted:#98A3BA; --line:#25304A;
  --navy:#081431; --gold:#FFC629; --accent:#8FB2FF; --teal:#8FB2FF;
  --alert:#FF6B5C; --alert-soft:#3A1A17; --exam:#C9A3EE; --exam-soft:#2B2240; --due:#F0B860; --due-soft:#33291A; --meet:#5CD1C8; --meet-soft:#14302D; --hl:#6B5A12; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font:16px/1.75 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3{font-family:var(--f-head);color:var(--ink);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.ico{display:inline-grid;place-items:center;flex:none}
.kicker{font:600 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:2px;background:currentColor}
.lead{font-size:18px;color:var(--muted);max-width:60ch}
.more{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:2px}
.more .arr{transition:transform .25s var(--ease)}
.more:hover .arr{transform:translateX(4px)}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;font:600 15px var(--f-body);text-decoration:none;border:0;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--gold);color:#0B2A63}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.h-sub{font:600 15px var(--f-body);color:var(--muted)}

/* reveal: visible by default; JS opts elements in only once it can observe them */
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.js .rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}html{scroll-behavior:auto}}

/* ---------- header ---------- */
.hdr{position:fixed;inset:0 0 auto;z-index:40;padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s,color .3s;color:#fff}
.hdr.solid,.hdr.inner{background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);box-shadow:0 1px 0 var(--line);color:var(--ink)}
.hdr-in{height:76px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;flex:none}
.brand img{width:46px;height:auto;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand b{display:block;font:700 17px/1.15 var(--f-head);letter-spacing:.01em}
.brand small{display:block;font-size:12px;opacity:.8;line-height:1.3}
.nav{display:flex;gap:0;margin-left:auto}
.nav a{color:inherit;text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 11px;position:relative;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.nav a:hover::after,.nav a[aria-current="true"]::after{transform:scaleX(1)}
.hbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px currentColor;opacity:.9}
.hbtn:hover{opacity:1;background:rgba(127,127,127,.12)}
.menu-btn{display:none}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(92vh,860px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#2a1a12}
.hero .bg{position:absolute;inset:0;background:url(img/hero.jpg) center 35%/cover no-repeat;animation:kb 24s var(--ease) both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,22,60,.9) 0%,rgba(6,22,60,.62) 40%,rgba(6,22,60,.05) 72%),linear-gradient(0deg,rgba(6,22,60,.7),transparent 45%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-bottom:clamp(56px,9vh,104px);padding-top:140px}
.hero .kicker{color:var(--sand)}
.hero h1{color:#fff;font-size:clamp(38px,5.4vw,72px);font-weight:700;line-height:1.1;max-width:13ch;margin:18px 0 18px}
.hero h1 span{color:var(--sand)}
.hero p{font-size:clamp(16px,1.5vw,19px);color:rgba(255,255,255,.85);max-width:44ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .wrap > *{animation:up .9s var(--ease) both}
.hero .wrap > :nth-child(2){animation-delay:.1s}.hero .wrap > :nth-child(3){animation-delay:.2s}.hero .wrap > :nth-child(4){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.scroll-cue{position:absolute;left:50%;bottom:22px;z-index:1;width:22px;height:36px;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);transform:translateX(-50%)}
.scroll-cue::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;border-radius:2px;background:#fff;transform:translateX(-50%);animation:cue 1.8s infinite}
@keyframes cue{0%{opacity:0;transform:translate(-50%,0)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,12px)}}

/* ---------- facts ---------- */
.facts{border-bottom:1px solid var(--line)}
.facts .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.fact{padding:36px 24px 34px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.fact:first-child{border-left:0;padding-left:0}
.fact b{font:700 clamp(36px,4vw,52px)/1 var(--f-head);color:var(--ink)}
.fact b small{font-size:.4em;font-weight:600;color:var(--muted);margin-left:6px}
.fact span{font-size:14px;color:var(--muted)}

/* ---------- sections ---------- */
section.s{padding:clamp(72px,10vw,128px) 0;position:relative;scroll-margin-top:40px}
section.s.alt{background:linear-gradient(180deg,var(--paper2),var(--paper))}
section.s.dark{background:var(--navy);color:var(--on-navy)}
section.s.dark h2,section.s.dark h3{color:#fff}
section.s.dark .lead{color:var(--on-navy-muted)}
section.s.dark .kicker{color:var(--sand)}
.s-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:end;margin-bottom:56px}
.s-head h2,.big-h{font-size:clamp(30px,3.6vw,48px);font-weight:700;margin-top:14px}
.s-head .right{display:flex;flex-direction:column;gap:18px;align-items:flex-start}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(32px,6vw,88px);align-items:start}
.about blockquote{margin:24px 0 0;font:500 clamp(18px,1.8vw,22px)/1.65 var(--f-head);color:var(--ink);padding-left:22px;border-left:3px solid var(--gold)}
.about blockquote b{color:var(--accent)}
.heads{list-style:none;margin:20px 0 0;padding:0;position:relative}
.heads::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:2px;background:var(--line)}
.heads li{position:relative;padding:8px 0 8px 32px;display:grid;grid-template-columns:130px 1fr;gap:12px}
.heads li::before{content:"";position:absolute;left:0;top:17px;width:12px;height:12px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--teal)}
.heads li:last-child::before{background:var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 25%,transparent)}
.heads .y{font:500 13px var(--f-mono);color:var(--muted);padding-top:3px}
.heads .n{color:var(--ink);font-weight:500}
.mosaic{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.mosaic figure{margin:0;overflow:hidden;border-radius:4px;position:relative;background:var(--paper2)}
.mosaic img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:transform 1.2s var(--ease),filter .6s}
.mosaic figure:hover img{transform:scale(1.04);filter:grayscale(0)}
.mosaic .big{grid-row:span 2}
.mosaic .wide{grid-column:span 2;aspect-ratio:16/9}
.mosaic figcaption{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 8px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}

/* curriculum */
.years{display:grid;grid-template-columns:repeat(3,1fr);position:relative;margin-bottom:72px}
.years::before{content:"";position:absolute;left:0;right:0;top:27px;height:2px;background:var(--line)}
.yr{position:relative;padding-right:32px}
.yr .dot{width:56px;height:56px;border-radius:50%;background:var(--paper2);box-shadow:inset 0 0 0 2px var(--ink);display:grid;place-items:center;font:700 20px var(--f-head);color:var(--ink);position:relative;transition:background .3s,color .3s}
.yr:hover .dot{background:var(--ink);color:var(--paper)}
.yr h3{font-size:20px;margin:20px 0 8px}
.yr p{font-size:15px;color:var(--muted)}
.yr p + p{margin-top:4px}
.domains{columns:2;column-gap:56px;list-style:none;margin:0;padding:0;counter-reset:d}
.domains li{break-inside:avoid;display:flex;gap:16px;padding:14px 0;border-top:1px solid var(--line);counter-increment:d}
.domains li::before{content:counter(d,decimal-leading-zero);font:500 13px var(--f-mono);color:var(--accent);padding-top:3px;min-width:22px}
.domains a{color:var(--ink);text-decoration:none;transition:color .2s}
.domains a:hover{color:var(--accent)}

/* care (dark) */
.care{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,88px);align-items:center}
.care-img{border-radius:4px;overflow:hidden;aspect-ratio:4/3;background:#000}
.care-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.care-img:hover img{transform:scale(1.05)}
.cap{display:block;margin-top:8px;font-size:11px;color:var(--on-navy-muted)}
.glist{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid rgba(255,255,255,.15)}
.glist li{border-bottom:1px solid rgba(255,255,255,.15)}
.glist a,.glist .soon{display:flex;align-items:center;gap:16px;padding:20px 0;color:#fff;text-decoration:none}
.glist a .ico{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#0B2A63}
.glist .soon{color:var(--on-navy-muted)}
.glist .soon .ico{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.glist b{font:600 19px var(--f-head);display:block}
.glist .soon b{color:var(--on-navy)}
.glist small{font-size:14px;color:var(--on-navy-muted)}
.glist .arr{margin-left:auto;transition:transform .3s var(--ease)}
.glist a:hover .arr{transform:translateX(6px)}

/* assessment */
.dims{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.dim{padding:28px 28px 28px 0;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:flex-start}
.dim:not(:nth-child(3n+1)){padding-left:28px;border-left:1px solid var(--line)}
.dim b{font:700 34px/1 var(--f-head);color:var(--teal);min-width:28px}
.dim span{font-size:16px;color:var(--ink);padding-top:4px}
.crit{margin-top:56px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px}
.crit ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.crit ol li::marker{color:var(--accent);font-weight:600}

/* schedule links */
.links{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.lk{display:flex;flex-direction:column;gap:10px;padding:32px 28px 32px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text);position:relative}
.lk:not(:nth-child(3n+1)){padding-left:28px;border-left:1px solid var(--line)}
.lk .ico{width:48px;height:48px;border-radius:50%;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:background .3s,color .3s,transform .3s var(--ease)}
.lk:hover .ico{background:var(--gold);color:#0B2A63;transform:rotate(-8deg);box-shadow:none}
.lk b{font:600 19px var(--f-head);color:var(--ink)}
.lk small{color:var(--muted);font-size:14px}
.lk .arr{position:absolute;right:20px;top:36px;opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .3s var(--ease);color:var(--accent)}
.lk:hover .arr{opacity:1;transform:none}

/* faculty */
.fgroup + .fgroup{margin-top:56px}
.fgroup > .h-sub{margin-bottom:24px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:36px 24px}
.person{display:flex;flex-direction:column;gap:12px}
.person .ph{aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--paper2);position:relative}
.person .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.person:hover .ph img{transform:scale(1.07)}
.person .ph::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 0 var(--gold);transition:box-shadow .3s}
.person:hover .ph::after{box-shadow:inset 0 0 0 4px var(--gold)}
.person b{font:600 15.5px/1.4 var(--f-head);color:var(--ink);display:block}
.person small{font-size:13px;color:var(--teal);font-weight:500}
.person .role{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--gold);padding:1px 8px;border-radius:999px;margin-top:4px}
.staff{margin-top:72px;padding-top:40px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
.staff .who{display:flex;flex-direction:column;gap:6px}
.staff .who b{font:600 22px var(--f-head);color:var(--ink)}
.staff .who p{color:var(--muted)}
.staff .who p a{color:var(--ink)}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:10px}
.gallery figure{margin:0;overflow:hidden;border-radius:4px;background:var(--paper)}
.gallery figure:nth-child(1){grid-column:span 2;grid-row:span 2}
.gallery figure:nth-child(4){grid-row:span 2}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.gallery figure:hover img{transform:scale(1.06)}

/* residents */
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,88px);align-items:start}
.res h3{font-size:22px;margin-bottom:6px}
.res .sub{color:var(--muted);font-size:15px;margin-bottom:18px}
.syslist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.syslist li{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.syslist .ico{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.syslist b{display:block;color:var(--ink);font-weight:600}
.syslist small{color:var(--muted);font-size:13px}
.syslist .tag-soon{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.syslist a{margin-left:auto}
.drive{display:flex;flex-direction:column;gap:16px;padding:32px;border-radius:4px;background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.drive::after{content:"";position:absolute;right:-36px;top:-36px;width:170px;height:170px;background:radial-gradient(circle at 50% 30%,var(--gold) 0 17%,transparent 18%),radial-gradient(circle at 32% 64%,#5C8DF0 0 17%,transparent 18%),radial-gradient(circle at 68% 64%,#5C8DF0 0 17%,transparent 18%);opacity:.85;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drive .kicker{color:var(--sand)}
.drive h3{color:#fff;font-size:22px;max-width:18ch}
.drive p{color:var(--on-navy-muted);font-size:15px;max-width:42ch}
.drive ol{margin:0;padding-left:1.2em;color:var(--on-navy);font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.drive .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:4px}
.drive a.lnk{color:#fff;font-size:14px}

/* footer */
footer.f{background:var(--navy);color:var(--on-navy-muted);padding:64px 0 calc(32px + env(safe-area-inset-bottom,0px));font-size:14px}
footer.f .top{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px;padding-bottom:36px;border-bottom:1px solid rgba(255,255,255,.12)}
footer.f .fb{display:flex;gap:14px;align-items:flex-start}
footer.f .fb img{width:56px;border-radius:6px}
footer.f b{color:#fff;font:600 16px var(--f-head);display:block;margin-bottom:8px}
footer.f a{color:var(--on-navy)}
footer.f ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
footer.f ul a{text-decoration:none}
footer.f ul a:hover{color:#fff;text-decoration:underline}
footer.f .bot{padding-top:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:12px}

/* ---------- inner pages ---------- */
.banner{background:var(--navy);color:var(--on-navy);padding:calc(76px + env(safe-area-inset-top,0px) + 64px) 0 64px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;right:0;top:0;bottom:0;width:50%;background:url(img/connectome.jpg) center/cover;opacity:.4;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%);animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.08) translateX(-12px)}}
.banner .wrap{position:relative;z-index:1}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--on-navy-muted)}
.crumb a{color:var(--on-navy-muted);text-decoration:none}
.crumb a:hover{color:#fff}
.banner h1{color:#fff;font-size:clamp(30px,4.2vw,54px);font-weight:700;margin:18px 0 10px;max-width:20ch;animation:up .7s var(--ease) both}
.banner p{color:var(--on-navy-muted);font-size:17px}
.page{display:grid;grid-template-columns:240px minmax(0,1fr);gap:clamp(32px,5vw,72px);padding-top:56px;padding-bottom:96px}
.side{position:sticky;top:104px;align-self:start;display:flex;flex-direction:column;gap:28px;font-size:14px}
.side h4{margin:0 0 10px;font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side nav{display:flex;flex-direction:column}
.side nav a{color:var(--text);text-decoration:none;padding:7px 0 7px 14px;border-left:2px solid var(--line);transition:border-color .2s,color .2s;line-height:1.45}
.side nav a:hover{color:var(--ink);border-left-color:var(--muted)}
.side nav a.on,.side nav a[aria-current="page"]{color:var(--ink);font-weight:600;border-left-color:var(--gold)}
.chips{display:none}

/* document blocks */
.doc{display:flex;flex-direction:column;gap:18px;min-width:0;max-width:780px}
.doc h2{font-size:26px;font-weight:700;margin-top:28px;display:flex;align-items:center;gap:14px;scroll-margin-top:110px}
.doc > h2:first-child{margin-top:0}
.doc h2 .hi{width:40px;height:40px;border-radius:50%;background:var(--paper2);color:var(--ink)}
.doc h3{font-size:18px;font-weight:600}
.doc ul,.doc ol{margin:0;padding-left:1.35em;display:flex;flex-direction:column;gap:6px}
.doc li::marker{color:var(--accent)}
.doc ol li::marker{font-family:var(--f-mono);font-size:13px}
.doc p{max-width:72ch}
.c-gray{color:var(--muted)} .c-red{color:var(--alert)} .c-blue{color:var(--teal)} .c-green{color:var(--meet)} .c-orange,.c-yellow,.c-brown{color:var(--due)} .c-purple,.c-pink{color:var(--exam)}
.step{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 16px var(--f-mono);display:inline-grid;place-items:center;flex:none}
.note,.alert{padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border-radius:4px}
.note{background:var(--paper2);border-left:3px solid var(--teal)}
.alert{background:var(--alert-soft);border-left:3px solid var(--alert)}
.note > .ico{color:var(--teal)} .alert > .ico{color:var(--alert)}
.alert a{color:inherit;font-weight:600}
.cbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.cols > div{display:flex;flex-direction:column;gap:10px;min-width:0}
.cols .alert,.cols .note{height:100%}
blockquote{margin:0;padding:4px 0 4px 20px;border-left:3px solid var(--gold);font-family:var(--f-head);font-size:18px;color:var(--ink);max-width:70ch}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
code{font-family:var(--f-mono);font-size:13px;background:var(--paper2);padding:2px 8px;border-radius:4px;word-break:break-all}
.rows{border-top:1px solid var(--line)}
.rows .r{display:grid;grid-template-columns:minmax(100px,180px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.rows .k{font-weight:600;font-size:14.5px;color:var(--ink)}
.rows .v{min-width:0}
.rows.time-rows .k{font:500 13px var(--f-mono);color:var(--muted);padding-top:3px;white-space:nowrap}
.rows .hd{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-block:8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:12px 14px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--ink)}
.tl{display:flex;flex-direction:column}
.tl-m{font:600 16px var(--f-head);color:var(--ink);padding:18px 0 4px;border-top:1px solid var(--line)}
.tl-m:first-child{border-top:0;padding-top:4px}
.tl-i{display:grid;grid-template-columns:140px 1fr;gap:2px 16px;padding:8px 0;font-size:14.5px}
.tl-i .when{grid-row:span 2;font-size:12.5px;color:var(--muted);padding-top:2px}
.tl-i .who{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;margin-right:4px;vertical-align:1px;white-space:nowrap}
.tag.exam{background:var(--exam-soft);color:var(--exam)} .tag.due{background:var(--due-soft);color:var(--due)} .tag.meet{background:var(--meet-soft);color:var(--meet)}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
details + details{margin-top:-18px}
summary{cursor:pointer;padding:16px 0;font:500 16.5px var(--f-head);color:var(--ink);list-style:none;display:flex;gap:14px;align-items:center;scroll-margin-top:120px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font:400 18px var(--f-body);flex:none;transition:transform .25s var(--ease),background .2s}
details[open] summary::after{transform:rotate(45deg);background:var(--gold);color:#0B2A63;box-shadow:none}
details > .dbody{padding:0 0 18px 40px;display:flex;flex-direction:column;gap:10px}
summary .dn{font:500 13px var(--f-mono);color:var(--accent);min-width:26px}
.tablist{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tablist::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--muted);font:500 15px var(--f-body);height:44px;padding:0 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab .td{font-size:10px;margin-left:6px;color:var(--teal)}
.tabpanel{margin-top:14px;display:flex;flex-direction:column;gap:10px}
mark.flash{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px;box-shadow:0 0 0 3px var(--hl)}
.next{margin-top:64px;padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.next a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);font:600 18px var(--f-head);max-width:48%}
.next a small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.next a.r{text-align:right;margin-left:auto}

/* ---------- search / ask ---------- */
.pal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(6,22,60,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pal-box{width:min(680px,100%);max-height:76vh;background:var(--paper);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:pop .25s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 12px 0 20px;height:62px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-in input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px var(--f-body);height:100%;outline:none}
.pal-in .x{border:0;background:var(--paper2);color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer}
.pal-body{overflow:auto;padding:8px}
.pal-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--text);font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.pal-row:hover,.pal-row.sel{background:var(--paper2)}
.pal-row .ic{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.pal-row.ai .ic{background:var(--gold);color:#0B2A63;box-shadow:none}
.pal-row .tx{display:flex;flex-direction:column;min-width:0}
.pal-row b{font:600 15px var(--f-head);color:var(--ink)}
.pal-row small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-row mark{background:var(--due-soft);color:inherit;border-radius:3px}
.pal-label{font-size:12px;color:var(--muted);padding:10px 12px 4px}
.answer{padding:12px;display:flex;flex-direction:column;gap:10px}
.answer .txt{display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.answer .txt ul{margin:0;padding-left:1.2em}
.answer .refs{display:flex;flex-wrap:wrap;gap:8px}
.answer .refs button{border:0;background:var(--paper2);color:var(--ink);font:500 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.answer .refs button:hover{background:var(--gold);color:#0B2A63}
.answer .fine{font-size:12px;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:12px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.empty{color:var(--muted);font-size:14px;padding:12px}

/* mobile menu */
.mnav{position:fixed;inset:0;z-index:35;background:var(--navy);color:#fff;padding:calc(84px + env(safe-area-inset-top,0px)) 24px 32px;display:flex;flex-direction:column;overflow:auto;animation:fade .25s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mnav a{color:#fff;text-decoration:none;font:600 23px/1.3 var(--f-head);padding:14px 0;border-bottom:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:baseline;gap:12px;animation:up .4s var(--ease) both}
.mnav a small{font:400 13px var(--f-body);color:var(--on-navy-muted)}

/* ---------- tablet / mobile ---------- */
@media (max-width:1140px){
  .nav{display:none}
  .menu-btn{display:grid;margin-left:auto}
}
@media (max-width:860px){
  .wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .hdr-in{height:64px;gap:10px}
  .brand img{width:40px}
  .brand b{font-size:15px}
  .brand small{display:none}
  .hero{min-height:90svh}
  .hero .bg{background-position:22% center}
  .hero::after{background:linear-gradient(0deg,rgba(6,22,60,.96) 0%,rgba(6,22,60,.75) 42%,rgba(6,22,60,.1) 78%)}
  .hero .wrap{padding-bottom:40px}
  .hero .ctas .btn{flex:1;justify-content:center}
  .scroll-cue{display:none}
  .facts .wrap{grid-template-columns:1fr 1fr}
  .fact{padding:24px 0 22px 20px}
  .fact:nth-child(odd){border-left:0;padding-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--line)}
  .s-head,.about,.care,.crit,.staff,.res{grid-template-columns:1fr;gap:28px}
  .s-head{margin-bottom:36px}
  .mosaic .big{grid-column:span 2;grid-row:auto;aspect-ratio:3/2}
  .heads li{grid-template-columns:104px 1fr;gap:8px}
  .years{grid-template-columns:1fr;gap:28px;margin-bottom:48px}
  .years::before{left:27px;right:auto;top:0;bottom:0;width:2px;height:auto}
  .yr{display:grid;grid-template-columns:56px 1fr;column-gap:18px;padding:0}
  .yr .dot{grid-row:span 4}
  .yr h3{margin:12px 0 2px}
  .domains{columns:1}
  .dims{grid-template-columns:1fr}
  .dim,.dim:not(:nth-child(3n+1)){padding:18px 0;border-left:0}
  .links{grid-template-columns:1fr}
  .lk,.lk:not(:nth-child(3n+1)){padding:20px 32px 20px 64px;border-left:0;min-height:88px;gap:2px}
  .lk .ico{position:absolute;left:0;top:20px}
  .lk .arr{opacity:1;transform:none;top:30px;right:0}
  .people{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;margin:0 -20px;padding:0 20px 8px;scrollbar-width:none}
  .people::-webkit-scrollbar{display:none}
  .person{flex:0 0 40%;scroll-snap-align:start}
  .gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -20px;padding:0 20px;scrollbar-width:none}
  .gallery::-webkit-scrollbar{display:none}
  .gallery figure{flex:0 0 80%;height:260px;scroll-snap-align:center}
  footer.f .top{grid-template-columns:1fr}
  .banner{padding:calc(64px + env(safe-area-inset-top,0px) + 36px) 0 40px}
  .banner::after{width:100%;opacity:.2}
  .page{grid-template-columns:minmax(0,1fr);padding-top:0;gap:0}.page > div{min-width:0}
  .side{display:none}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 28px;padding:12px 20px;scrollbar-width:none;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .chips::-webkit-scrollbar{display:none}
  .chips button,.chips a{flex:none;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:500 13px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;text-decoration:none}
  .chips .on,.chips [aria-current="page"]{background:var(--ink);color:var(--paper);box-shadow:none}
  .doc h2{font-size:22px;scroll-margin-top:130px}
  details > .dbody{padding-left:0}
  .rows .r{grid-template-columns:1fr;gap:2px}
  .rows.time-rows .r{grid-template-columns:100px 1fr;gap:10px}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr{border-bottom:1px solid var(--line);padding:10px 0}
  .tbl td{border:0;padding:2px 0}
  .tbl td:first-child{font-weight:600;color:var(--ink)}
  .tbl td[data-label]:not(:first-child)::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .tl-i{grid-template-columns:1fr}
  .tl-i .when{grid-row:auto}
  .next a{max-width:100%}
  .pal{padding:0;align-items:stretch}
  .pal-box{width:100%;max-height:none;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
}

/* resident-first home */
.hero{min-height:min(78vh,760px)}
.hero h1{max-width:15ch}
.hsearch{margin-top:28px;width:min(560px,100%);height:58px;display:flex;align-items:center;gap:12px;padding:0 10px 0 20px;border:0;border-radius:999px;background:rgba(255,255,255,.94);color:#5E6378;font:16px var(--f-body);cursor:text;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s var(--ease),box-shadow .2s}
.hsearch:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.3)}
.hsearch span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsearch kbd{font:500 12px var(--f-mono);background:#ECE8E0;color:#18204A;border-radius:999px;padding:4px 10px}
.quick{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px}
.quick a{color:#fff;font-size:14.5px;font-weight:500;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:2px;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,color .2s}
.quick a:hover{color:var(--sand);border-color:var(--sand)}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.path li{border-bottom:1px solid var(--line)}
.path li:not(:nth-child(3n+1)){border-left:1px solid var(--line)}
.path a{display:flex;flex-direction:column;gap:6px;padding:30px 28px 30px 0;text-decoration:none;color:var(--text);position:relative;height:100%}
.path li:not(:nth-child(3n+1)) a{padding-left:28px}
.path .n{font:700 40px/1 var(--f-head);color:transparent;-webkit-text-stroke:1.5px var(--accent);margin-bottom:8px;transition:color .3s}
.path a:hover .n{color:var(--accent)}
.path b{font:600 19px var(--f-head);color:var(--ink)}
.path small{font-size:14px;color:var(--muted)}
.path .arr{position:absolute;right:20px;top:36px;color:var(--accent);opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .3s var(--ease)}
.path a:hover .arr{opacity:1;transform:none}
.links-inline{display:flex;flex-wrap:wrap;gap:8px 20px}
.links-inline a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:2px;font-size:15px}
.sched{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,88px)}
.day{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.day li{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);position:relative}
.day .t{font:500 13px var(--f-mono);color:var(--muted);padding-top:3px}
.day.ev .t{font:500 13px var(--f-body)}
.day small{display:block;font-size:13px;color:var(--muted)}
.day li.past{opacity:.45}
.day li.now .t{color:var(--accent);font-weight:600}
.day li.now::before{content:"";position:absolute;left:-18px;top:21px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
.urgent{color:var(--ink)!important;line-height:2}
.urgent b{font-family:var(--f-mono);font-weight:500}
@media (max-width:860px){
  .hero{min-height:84svh}
  .hsearch{height:54px;font-size:15px}
  .hsearch kbd{display:none}
  .quick{gap:8px 16px}
  .path{grid-template-columns:1fr}
  .path li:not(:nth-child(3n+1)){border-left:0}
  .path a,.path li:not(:nth-child(3n+1)) a{padding:20px 32px 20px 64px}
  .path .n{position:absolute;left:0;top:20px;font-size:30px}
  .path .arr{opacity:1;transform:none;right:0;top:26px}
  .sched{grid-template-columns:1fr;gap:40px}
  .day li{grid-template-columns:104px 1fr;gap:10px}
  .day li.now::before{left:-12px}
}

/* lean structure + tidy content */
.dir{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 40px}
.dcol h3{font:600 13px var(--f-body);letter-spacing:.08em;color:var(--accent);padding-bottom:14px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:8px}
.dcol h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.dcol ul{list-style:none;margin:0;padding:0}
.dcol li{border-bottom:1px solid var(--line)}
.dcol a{display:flex;gap:14px;padding:16px 0;text-decoration:none;color:var(--text);transition:padding .25s var(--ease)}
.dcol a:hover{padding-left:6px}
.dcol .n{font:500 12px var(--f-mono);color:var(--muted);padding-top:4px}
.dcol b{display:block;font:600 16px/1.4 var(--f-head);color:var(--ink)}
.dcol a:hover b{color:var(--accent)}
.dcol small{font-size:13px;color:var(--muted)}
.side{gap:22px;max-height:calc(100vh - 124px);overflow:auto;padding-right:6px}
.side .sub{display:flex;flex-direction:column;margin:2px 0 6px 14px}
.side .sub a{font-size:13px;color:var(--muted);padding:4px 0 4px 12px;border-left:1px solid var(--line)}
.side .sub a.on{color:var(--accent);border-left-color:var(--accent);font-weight:500}
.side nav a[aria-current="page"]{border-left-color:var(--gold)}
.mtree{margin-top:20px;display:flex;flex-direction:column}
.mtree p{font:600 12px var(--f-body);letter-spacing:.1em;color:var(--sand);margin:16px 0 4px}
.mnav .mtree a{font:500 16px/1.4 var(--f-body);padding:9px 0;border-bottom:0;animation:none}
.grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:24px 36px;align-items:start}
.grp{display:flex;flex-direction:column;gap:10px;min-width:0}
.grp .gh{font-weight:600;color:var(--ink);padding-bottom:8px;border-bottom:2px solid var(--gold);max-width:none}
.grp .gh b{font-weight:600}
.doc ul{list-style:none;padding-left:0}
.doc ul > li{position:relative;padding-left:20px}
.doc ul > li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.doc ul ul > li::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.doc li > ul,.doc li > ol{margin-top:6px}
.doc ol:not(.steps){list-style:none;padding-left:0;counter-reset:o}

/* ---------- schedule data (weekly tabs + calendar) ---------- */
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function bkkNow(){ const d = new Date(); return new Date(d.getTime() + d.getTimezoneOffset()*60000 + 7*3600000); }
const minutes = s => { const m = String(s).match(/(\d{1,2})[.:](\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; };
function tabsOf(md){ const lines = md.split('\n'); const i = lines.findIndex(l => /^\s*<tabs[\s>]/.test(l)); if (i < 0) return []; return splitChildren(collect(lines, i, 'tabs')[1], 'tab'); }
function tableIn(lines){ const ti = lines.findIndex(l => /^\s*<table[\s>]/.test(l)); if (ti < 0) return null; const [head, inner] = collect(lines, ti, 'table'); return parseTable(head, inner); }
function weekRows(){
  const w = STATE.bySlug.weekly, out = {}; if (!w) return out;
  for (const tb of tabsOf(w.md)){ const [label, rest] = firstLine(tb.lines); const d = DAYS.indexOf(strip(label)); const t = tableIn(rest); if (d < 0 || !t) continue; out[d] = (t.hr ? t.rows.slice(1) : t.rows).map(r => [strip(r[0]), r[1]]); }
  return out;
}
function calEvents(){
  const c = STATE.bySlug.calendar, out = []; if (!c) return out;
  for (const tb of tabsOf(c.md)){ const [, rest] = firstLine(tb.lines); const t = tableIn(rest); if (!t || !t.hr || strip(t.rows[0][0]) !== 'เดือน') continue;
    let cur = ''; for (const r of t.rows.slice(1)){ const m = strip(r[0]); if (m) cur = m; if (strip(r[2]).startsWith('มีเฉพาะ')) continue; out.push({m: cur, when: r[1], what: r[2], who: r[3]}); } }
  return out;
}
function upcomingMonth(){
  const ev = calEvents(), d = bkkNow();
  for (let k = 0; k < 12; k++){ const i = (d.getMonth() + k) % 12; const e = ev.filter(x => x.m === MONTHS[i]); if (e.length) return {name: MONTHS_FULL[i], now: k === 0, ev: e}; }
  return {name:'', ev:[]};
}
function dayList(rows){
  const now = bkkNow(), cur = now.getHours()*60 + now.getMinutes(), wd = now.getDay(), isToday = rows === weekRows()[wd];
  return rows.map(r => { const [a, z] = r[0].split(/–|-/).map(minutes); const st = isToday && a != null && z != null ? (cur >= z ? ' past' : cur >= a ? ' now' : '') : '';
    return `<li class="${st}"><span class="t">${esc(r[0])}</span><span>${inline(r[1]||'')}</span></li>`; }).join('');
}

const telNums = t => t.split(',').map(x => x.trim()).filter(Boolean).map(x => `<a href="tel:${tel(x)}">${esc(x)}</a>`).join('');
function telList(u){
  const out = []; const re = /([^·<>]+?)\s*<b>([^<]+)<\/b>/g; let m;
  while ((m = re.exec(u || ''))) out.push(`<li><span>${esc(m[1].trim())}</span><span class="nums">${telNums(m[2])}</span></li>`);
  return `<ul class="tel">${out.join('')}</ul>`;
}

function bkkDay(){ const d = new Date(); return new Date(d.getTime() + d.getTimezoneOffset()*60000 + 7*3600000).getDay(); }
function initTabs(el){
  el.querySelectorAll('.tabs').forEach((box, bi) => {
    const panels = [...box.children].filter(c => c.classList.contains('tabpanel')); if (!panels.length) return;
    const list = document.createElement('div'); list.className = 'tablist'; list.setAttribute('role','tablist');
    let start = panels.findIndex(p => p.dataset.today); if (start < 0) start = 0;
    panels.forEach((p, i) => { const id = `t${bi}-${i}`; p.id = id + 'p'; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby', id);
      const b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.id = id; b.setAttribute('role','tab'); b.setAttribute('aria-controls', p.id);
      b.innerHTML = esc(p.dataset.tab) + (p.dataset.today ? '<span class="td">วันนี้</span>' : ''); b.addEventListener('click', () => select(i)); list.appendChild(b); });
    box.prepend(list);
    function select(i){ panels.forEach((p, j) => { p.hidden = j !== i; list.children[j].setAttribute('aria-selected', String(j === i)); }); }
    box._select = select; select(start);
  });
}
let pendingFind = null, pendingDomain = null;
function findAndFlash(text){
  const doc = document.getElementById('doc'); if (!doc || !text) return false;
  const norm = s => s.replace(/\s+/g,' ').trim();
  for (const needle of [norm(text), norm(text).slice(0,40), norm(text).slice(0,18)].filter(x => x.length >= 4)){
    const w = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())){
      const at = n.nodeValue.indexOf(needle); if (at < 0) continue;
      const d = n.parentElement.closest('details'); if (d) d.open = true;
      const tp = n.parentElement.closest('.tabpanel'); if (tp && tp.hidden){ const box = tp.parentElement; box._select && box._select([...box.children].filter(c => c.classList.contains('tabpanel')).indexOf(tp)); }
      const r = document.createRange(); r.setStart(n, at); r.setEnd(n, Math.min(n.nodeValue.length, at + needle.length));
      const mk = document.createElement('mark'); mk.className = 'flash'; try { r.surroundContents(mk); } catch(_) {}
      (mk.isConnected ? mk : n.parentElement).scrollIntoView({block:'center'});
      setTimeout(() => { if (mk.isConnected) mk.replaceWith(...mk.childNodes); }, 4500);
      return true;
    }
  }
  return false;
}

/* ---------- effects ---------- */
let io = null;
function afterRender(){
  if (root.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) root.animate([{opacity:0},{opacity:1}], {duration:320, easing:'ease-out'});
  const prog = document.getElementById('prog');
  const hdr = document.getElementById('hdr');
  window.onscroll = () => { const max = document.documentElement.scrollHeight - innerHeight; prog.style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`; if (!hdr.classList.contains('inner')) hdr.classList.toggle('solid', scrollY > 40 || !!document.querySelector('.mnav')); };
  window.onscroll();
  document.getElementById('menu-btn').onclick = toggleMenu;
  const els = root.querySelectorAll('.rv');
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches){ els.forEach(e => e.classList.add('on')); return; }
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -6% 0px'});
  els.forEach(e => io.observe(e));
}
function toggleMenu(){
  const btn = document.getElementById('menu-btn'), open = document.querySelector('.mnav');
  if (open){ open.remove(); btn.innerHTML = svg('menu',20); btn.setAttribute('aria-expanded','false'); window.onscroll && window.onscroll(); return; }
  const m = document.createElement('nav'); m.className = 'mnav'; m.setAttribute('aria-label','เมนู');
  m.innerHTML = [['#top','หน้าแรก','',''], ...NAV].map(([h,t,,s],i) => `<a href="${h}" style="animation-delay:${i*35}ms">${t}<small>${s||''}</small></a>`).join('')
    + `<div class="mtree">${SECTIONS.map(s => { const ps = pagesIn(s.id); return ps.length ? `<p>${esc(s.name)}</p>${ps.map(x => `<a href="#${x.slug}">${esc(x.title)}</a>`).join('')}` : ''; }).join('')}</div>`;
  m.addEventListener('click', e => { if (e.target.closest('a')) toggleMenu(); });
  document.body.appendChild(m); btn.innerHTML = svg('x',20); btn.setAttribute('aria-expanded','true');
  document.getElementById('hdr').classList.add('solid');
}

/* ---------- routing ---------- */
const HOME_ANCHORS = ['top','guide','today','apps','faculty','about'];
let onHome = false;
function route(){
  closePal(); const mn = document.querySelector('.mnav'); if (mn) mn.remove();
  const h = decodeURIComponent(location.hash.replace('#',''));
  const alias = null;
  const p = STATE.bySlug[alias || h];
  if (p && (alias || !HOME_ANCHORS.includes(h))){
    onHome = false; renderPage(p);
    if (pendingDomain){ const d = document.getElementById('d-' + pendingDomain); pendingDomain = null; if (d){ d.open = true; setTimeout(() => d.querySelector('summary').scrollIntoView({block:'start'}), 30); return; } }
    if (pendingFind){ const f = pendingFind; pendingFind = null; setTimeout(() => { if (!findAndFlash(f)) window.scrollTo(0,0); }, 60); } else window.scrollTo(0,0);
    return;
  }
  if (!onHome){ renderHome(); onHome = true; }
  const target = h && h !== 'top' ? document.getElementById(h) : null;
  if (target) setTimeout(() => target.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}), 30); else window.scrollTo(0,0);
}

/* ---------- search / ask ---------- */
const pal = document.getElementById('pal'), pq = document.getElementById('pq'), pbody = document.getElementById('pal-body');
document.getElementById('pal-ic').innerHTML = svg('search',18);
let samplePromise = null, aiOK = false, askCtl = null, lastAnswer = null;
function getSample(){ if (!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample').catch(() => null) : Promise.resolve(null); return samplePromise; }
getSample().then(s => { aiOK = !!s; if (!pal.hidden) palRender(); });
function openPal(){ pal.hidden = false; pq.value = ''; lastAnswer = null; palRender(); setTimeout(() => pq.focus(), 30); }
function closePal(){ if (!pal.hidden){ pal.hidden = true; if (askCtl) askCtl.abort(); } }
function palRender(){
  const q = pq.value.trim(), ql = q.toLowerCase();
  if (lastAnswer) return;
  let h = '';
  if (q && aiOK) h += `<button type="button" class="pal-row ai sel" data-ask>${ico('spark',17,1.8,'ic')}<span class="tx"><b>สอบถาม AI จากเนื้อหาคู่มือ</b><small>“${esc(q)}”</small></span></button>`;
  const hits = q ? STATE.pages.filter(p => (p.title + ' ' + (p.desc||'') + ' ' + p.text).toLowerCase().includes(ql)) : STATE.pages;
  if (q && !hits.length && !aiOK) h += `<p class="empty">ไม่พบ “${esc(q)}”</p>`;
  if (hits.length) h += `<p class="pal-label">${q ? 'ผลการค้นหา' : 'หัวข้อทั้งหมด'}</p>` + hits.map(p => {
    let sub = esc(p.desc || '');
    if (q){ const t = p.text.replace(/\n/g,' '), i = t.toLowerCase().indexOf(ql); if (i >= 0){ const from = Math.max(0, i - 24), sn = t.substr(from, 90), k = sn.toLowerCase().indexOf(ql); sub = (from ? '…' : '') + esc(sn.slice(0,k)) + '<mark>' + esc(sn.substr(k, q.length)) + '</mark>' + esc(sn.slice(k + q.length)); } }
    return `<a class="pal-row" href="#${p.slug}" data-find="${q ? esc(q) : ''}">${ico(iconFor(p.icon),17,1.8,'ic')}<span class="tx"><b>${esc(p.title)}</b><small>${sub}</small></span></a>`;
  }).join('');
  pbody.innerHTML = h;
}
pq.addEventListener('input', () => { lastAnswer = null; palRender(); });
pq.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); const q = pq.value.trim(); if (!q) return; if (aiOK) ask(q); else { const a = pbody.querySelector('a.pal-row'); if (a) a.click(); } } if (e.key === 'Escape') closePal(); });
document.getElementById('pal-x').addEventListener('click', closePal);
pal.addEventListener('click', e => { if (e.target === pal) closePal(); else if (e.target.closest('[data-ask]')) ask(pq.value.trim()); });
function corpus(){
  const fac = (STATE.site.faculty || []).map(g => g.group + ': ' + g.people.map(p => p.name + (p.area ? ' (' + p.area + ')' : '')).join(', ')).join('\n');
  const heads = (STATE.site.heads || []).map(h => h.years + ' ' + h.name).join('\n');
  return STATE.pages.map(p => `=== PAGE id="${p.slug}" title="${p.title}" ===\n${p.text}`).join('\n\n') + `\n\n=== คณาจารย์ ===\n${fac}\n\n=== หัวหน้าหน่วย ===\n${heads}`;
}
async function ask(question){
  const sample = await getSample(); if (!sample || !question) return;
  lastAnswer = {pending:true};
  pbody.innerHTML = `<div class="thinking"><span class="dots"><i></i><i></i><i></i></span>กำลังค้นหาคำตอบ…</div>`;
  if (askCtl) askCtl.abort(); askCtl = new AbortController();
  const prompt = `You answer questions from neurology residents at Ramathibodi Hospital using ONLY the handbook text below.
Rules:
- Use only facts stated in the handbook. Do not add outside medical knowledge, doses or advice.
- If the handbook does not contain the answer, set "found" to false and say so briefly in Thai.
- Answer in Thai, short and direct (1-3 sentences, or up to 4 short bullet lines starting with "- "). Keep numbers, times and phone numbers exactly as written.
- Each source: "page" is one of the PAGE ids below; "quote" is 6-20 words copied EXACTLY from that page's text where the answer is. Facts from the faculty or head-of-unit lists need no source.
Reply with only JSON: {"found": true|false, "answer": "...", "sources": [{"page": "id", "quote": "..."}]} with at most 3 sources.

Question: ${question}

HANDBOOK:
${corpus()}`;
  try {
    const out = await sample.json(prompt, {modelTier:'quick', signal: askCtl.signal});
    lastAnswer = {question, out}; showAnswer();
  } catch(e){
    const code = e && e.code;
    if (code === 'cancelled') return;
    if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared') aiOK = false;
    const msg = {not_granted:'ไม่ได้อนุญาตให้ใช้ AI ในหน้านี้', sampling_disabled:'บัญชีนี้ใช้ AI ไม่ได้', rate_limited:'ถามบ่อยเกินไป ลองใหม่อีกสักครู่', session_expired:'กรุณาเข้าสู่ระบบ Claude ใหม่'}[code] || 'ตอบไม่สำเร็จ ลองใหม่อีกครั้ง';
    lastAnswer = null; pbody.innerHTML = `<p class="empty">${esc(msg)}</p>`;
  }
}
function showAnswer(){
  const out = lastAnswer.out || {};
  const lines = String(out.answer || '').split('\n').map(s => s.trim()).filter(Boolean);
  let txt = '', ul = []; const flush = () => { if (ul.length){ txt += '<ul>' + ul.map(l => `<li>${esc(l)}</li>`).join('') + '</ul>'; ul = []; } };
  for (const l of lines){ if (/^[-•]\s+/.test(l)) ul.push(l.replace(/^[-•]\s+/,'')); else { flush(); txt += `<p>${esc(l)}</p>`; } } flush();
  const srcs = (Array.isArray(out.sources) ? out.sources : []).filter(s => s && STATE.bySlug[s.page]).slice(0,3);
  pbody.innerHTML = `<div class="answer"><div class="txt">${txt || '<p>ไม่พบคำตอบในคู่มือ</p>'}</div>${srcs.length ? `<div class="refs">${srcs.map((s,i) => `<button type="button" data-src="${i}">${svg('arrow',14)}${esc(STATE.bySlug[s.page].title)}</button>`).join('')}</div>` : ''}<p class="fine">คำตอบอ้างอิงจากคู่มือ โปรดตรวจสอบกับต้นฉบับก่อนนำไปใช้</p></div>`;
  pbody.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => { const s = srcs[+b.dataset.src]; pendingFind = String(s.quote||''); if (location.hash === '#' + s.page) route(); else location.hash = s.page; }));
}

/* ---------- global ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-open-pal]')){ openPal(); return; }
  const d = e.target.closest('[data-open-d]'); if (d) pendingDomain = d.dataset.openD;
  const fs = e.target.closest('[data-step]'); if (fs){ const hh = [...document.querySelectorAll('.doc h2 .step')].find(x => x.textContent.trim() === fs.dataset.step); if (hh) hh.parentElement.scrollIntoView({block:'start'}); return; }
  const j = e.target.closest('[data-jump]'); if (j){ e.preventDefault(); const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({block:'start'}); return; }
  const f = e.target.closest('a[data-find]'); if (f && f.dataset.find) pendingFind = f.dataset.find;
  const a = e.target.closest('a[href^="#"]');
  if (a && a.getAttribute('href') === location.hash){ e.preventDefault(); route(); }
});
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); pal.hidden ? openPal() : closePal(); } });
window.addEventListener('hashchange', route);
load().then(route).catch(() => { root.innerHTML = '<p style="padding:120px 24px;text-align:center">โหลดเนื้อหาไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้ง</p>'; });
})();
</script>
